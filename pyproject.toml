[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-agentic-recognition"
version = "0.1.0"
description = "Real-time Indian Sign Language recognition with an agentic sentence layer"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
app = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "streamlit>=1.34",
    "streamlit-webrtc>=0.47",
    "torch>=2.2",
    "torchvision>=0.17",
]
train = [
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
