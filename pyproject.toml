[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-agentic-recognition"
version = "0.1.0"
description = "Real-time Indian Sign Language recognition with an agentic sentence layer"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
app = [
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "streamlit>=1.37",
    "streamlit-webrtc>=0.47",
    "torch>=2.2",
    "torchvision>=0.17",
]
train = [
    "matplotlib>=3.8",
    "mlflow>=2.12",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "black>=25.1",
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tools", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml"
